<div id="tab-contacto" class="tab-pane">
  <div class="panel bevel-out">
    <div class="panel-header dark" style="background: #00003c; color: #fff; font-size: 13px;">
      📄 TRANSMISIÓN SEGURA
    </div>
    <div class="panel-body dark">
      <div class="markdown-reader bevel-in" style="height: auto; min-height: 450px;">
        <h1 style="margin-top: 0;">CONTACTO // ENCRIPTADO</h1>
        <p>¿Tienes dudas, comentarios o quieres colaborar en algún proyecto? Abre un canal de comunicación directo utilizando el formulario a continuación.</p>
        
        <form id="contactForm" autocomplete="off" style="display: flex; flex-direction: column; gap: 15px; margin-top: 25px; padding: 20px; border: 1px solid var(--crt-green); background: #00001a; box-shadow: inset 0 0 10px rgba(57, 255, 140, 0.1);">
          
          <div style="display: flex; flex-direction: column; gap: 5px;">
            <label style="font-family: var(--font-mono); color: var(--crt-green); font-size: 13px;">> IDENTIFICADOR (Nombre/Alias):</label>
            <input type="text" id="contactName" required style="font-family: var(--font-mono); font-size: 14px; padding: 8px; border: 1px solid #333; background: #000; color: #fff; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='var(--crt-green)'" onblur="this.style.borderColor='#333'">
          </div>

          <div style="display: flex; flex-direction: column; gap: 5px;">
            <label style="font-family: var(--font-mono); color: var(--crt-green); font-size: 13px;">> RUTA DE RETORNO (Email):</label>
            <input type="email" id="contactEmail" required style="font-family: var(--font-mono); font-size: 14px; padding: 8px; border: 1px solid #333; background: #000; color: #fff; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='var(--crt-green)'" onblur="this.style.borderColor='#333'">
          </div>

          <div style="display: flex; flex-direction: column; gap: 5px;">
            <label style="font-family: var(--font-mono); color: var(--crt-green); font-size: 13px;">> CARGA ÚTIL (Mensaje):</label>
            <textarea id="contactMessage" required rows="6" style="font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; padding: 10px; border: 1px solid #333; background: #000; color: #d4d4d4; outline: none; resize: vertical; transition: border-color 0.2s;" onfocus="this.style.borderColor='var(--crt-green)'" onblur="this.style.borderColor='#333'"></textarea>
          </div>

          <div style="display: flex; gap: 15px; justify-content: flex-end; margin-top: 10px;">
            <button type="reset" style="padding: 8px 20px; background: #1a0000; border: 1px solid #ff3939; color: #ff3939; font-family: var(--font-mono); font-size: 13px; cursor: url('Media/Img/imperdible-abierto-48.png') 31 8, pointer; transition: background 0.2s;" onmouseover="this.style.background='#330000'" onmouseout="this.style.background='#1a0000'">[ ABORTAR ]</button>
            <button type="submit" style="padding: 8px 20px; background: #001a0b; border: 1px solid var(--crt-green); color: var(--crt-green); font-family: var(--font-mono); font-size: 13px; cursor: url('Media/Img/imperdible-abierto-48.png') 31 8, pointer; transition: background 0.2s;" onmouseover="this.style.background='#003316'" onmouseout="this.style.background='#001a0b'">[ TRANSMITIR ]</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
